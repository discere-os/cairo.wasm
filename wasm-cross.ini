# Meson cross-compilation file for WebAssembly (cairo.wasm)
# Production-grade 2D graphics library with WASM SIMD optimization
# Copyright 2025 Superstruct Ltd, New Zealand - Licensed under LGPL 2.1

[binaries]
c = 'emcc'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkgconfig = 'pkg-config'

[properties]
c_args = [
  # WASM SIMD128 optimization (Emscripten 4.0.13+)
  '-msimd128',
  
  # Cairo-specific optimizations
  '-DCAIRO_HAS_IMAGE_SURFACE=1',
  '-DCAIRO_HAS_PNG_FUNCTIONS=1',
  '-DCAIRO_HAS_SVG_SURFACE=1',
  '-DCAIRO_HAS_PDF_SURFACE=1',
  '-DCAIRO_HAS_PS_SURFACE=1',
  '-DCAIRO_HAS_SCRIPT_SURFACE=1',
  
  # Disable platform-specific backends
  '-DCAIRO_HAS_XLIB_SURFACE=0',
  '-DCAIRO_HAS_XCB_SURFACE=0',
  '-DCAIRO_HAS_QUARTZ_SURFACE=0',
  '-DCAIRO_HAS_WIN32_SURFACE=0',
  
  # Performance optimization
  '-O3',
  '-ffast-math',
  '-fstrict-aliasing',
  '-flto',
  
  # WASM-specific optimizations
  '-DNDEBUG',
  '-D_GNU_SOURCE',
  '-DCAIRO_WASM_SIMD=1'
]

c_link_args = [
  # WASM SIMD support
  '-msimd128',
  
  # Memory configuration for graphics workloads
  '-s', 'INITIAL_MEMORY=128MB',
  '-s', 'MAXIMUM_MEMORY=2GB',
  '-s', 'ALLOW_MEMORY_GROWTH=1',
  
  # Performance settings
  '-O3',
  '-flto',
  
  # Module configuration
  '-s', 'WASM=1',
  '-s', 'MODULARIZE=1',
  '-s', 'EXPORT_ES6=1',
  
  # JavaScript integration for graphics
  '-s', 'EXPORTED_RUNTIME_METHODS=["ccall","cwrap","HEAPU8","HEAPU32","HEAPF32","addFunction","removeFunction","FS"]',
  '-s', 'RESERVED_FUNCTION_POINTERS=20',
  
  # File system for graphics I/O
  '-s', 'FORCE_FILESYSTEM=1',
  
  # Environment support
  '-s', 'ENVIRONMENT=web,webview,worker,node'
]

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'