[binaries]
c = 'emcc'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[built-in options]
c_std = 'gnu99'
buildtype = 'release'
default_library = 'static'
c_args = ['-O3', '-msimd128', '-fPIC', '-DCAIRO_WASM_SIMD=1', '-DNDEBUG']
c_link_args = ['-O3', '-msimd128']